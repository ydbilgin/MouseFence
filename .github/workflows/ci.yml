name: Rust CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  gate-g:
    if: github.event.repository.private == false && github.repository == github.event.repository.full_name
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Settings UI with real backend
        env:
          MF_UI_REAL_BACKEND: '1'
        run: cargo test -p fence-settings-ui --locked
      - name: Strict parity tracks A, B, C, D and S
        shell: pwsh
        env:
          MF_PARITY_STRICT: '1'
        run: |
          foreach ($track in @('A', 'B', 'C', 'D', 'S')) {
            $env:MF_PARITY_TRACK = $track
            cargo test -p parity --locked
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Extract pinned 1.1.1 reference sources
        run: python tools/reference-cs/fetch_sources.py
      - name: Build parity reference
        run: dotnet build tools/reference-cs/MouseFence.Reference.csproj -c Release -o reference-build
      - name: Reference engine and trace parity
        shell: pwsh
        run: |
          $env:MF_REFERENCE_EXE = Join-Path $pwd 'reference-build/MouseFence.Reference.exe'
          cargo test -p fence-engine -p fence-trace --locked -- --ignored --nocapture
      - name: Release build
        run: cargo build -p mousefence --release --locked
      - name: Inspect release resources and runtime imports without launching the app
        shell: pwsh
        run: |
          $env:MF_BUILT_EXE = Join-Path $pwd 'target/x86_64-pc-windows-msvc/release/MouseFence.exe'
          cargo test -p mousefence --test resources --locked -- --nocapture
