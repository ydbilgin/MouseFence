name: Feature request
description: Suggest an idea or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation with your screens and what goes wrong today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like MouseFence to do?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MouseFence version you use
      placeholder: v1.1.1
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
