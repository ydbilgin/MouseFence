[package]
name = "fence-settings-ui"
description = "MouseFence settings window (egui/eframe, separate on-demand process) and the dev CLI modes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fence-types.workspace = true
fence-engine.workspace = true
fence-config.workspace = true
fence-i18n.workspace = true
fence-win.workspace = true
# C# Settings.ReadVersion (the restore path reads the raw "SettingsVersion" before normalizing).
serde_json.workspace = true
# Renderer glow (PLAN T16, decided by the invisible-desktop screenshot evidence in TRACK-D.txt).
eframe.workspace = true

# Win32 for the identify overlay, the file dialogs, the virtual-screen rect and the high-contrast system colors.
# Declared here (not in [workspace.dependencies]) so the Track C windows-sys line cannot collide at the join.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
