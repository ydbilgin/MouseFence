@variant light bg1=#FFFFFF bg2=#F1F4F8 glow=0.07 frame=#D0D7DE frame_op=1 kick=#CF3A3A ink=#1F2328 soft=#57606A screen=#0B1220 screen_op=0.025 edge=#8C959F edge_op=0.55 label=#8C959F cursor=#FFFFFF cursor_line=#1F2328
@variant dark bg1=#0E141D bg2=#1B2432 glow=0.20 frame=#FFFFFF frame_op=0.08 kick=#E44A4A ink=#F0F6FC soft=#AEB8C6 screen=#FFFFFF screen_op=0.045 edge=#FFFFFF edge_op=0.17 label=#7D8896 cursor=#F5F8FC cursor_line=#0E141D
@wrap tagline chars=36 lines=2 line_height=40 top=234
@out docs/media/banner-{{variant}}.svg
---
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
<title>{{name}}: {{tagline}}</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="{{bg1}}"/><stop offset="1" stop-color="{{bg2}}"/></linearGradient>
<radialGradient id="glow" cx="0.78" cy="0.42" r="0.45"><stop offset="0" stop-color="#E44A4A" stop-opacity="{{glow}}"/><stop offset="1" stop-color="#E44A4A" stop-opacity="0"/></radialGradient>
<clipPath id="card"><rect width="1280" height="360" rx="20"/></clipPath>
</defs>
<g clip-path="url(#card)"><rect width="1280" height="360" fill="url(#bg)"/><rect width="1280" height="360" fill="url(#glow)"/></g>
<rect x="0.5" y="0.5" width="1279" height="359" rx="20" fill="none" stroke="{{frame}}" stroke-opacity="{{frame_op}}"/>
<g font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif">
<text x="88" y="98" font-size="16" font-weight="600" letter-spacing="3" fill="{{kick}}" style="text-transform:uppercase">{{kicker}}</text>
<text x="84" y="178" font-size="84" font-weight="700" letter-spacing="-1.5" fill="{{ink}}">{{name}}</text>
{{#tagline_lines}}
<text x="88" y="{{y}}" font-size="30" fill="{{soft}}">{{text}}</text>
{{/tagline_lines}}
</g>
<g>
<rect x="836" y="40" width="300" height="122" rx="10" fill="{{screen}}" fill-opacity="{{screen_op}}" stroke="{{edge}}" stroke-opacity="{{edge_op}}" stroke-width="1.5"/>
<rect x="780" y="186" width="412" height="150" rx="10" fill="{{screen}}" fill-opacity="{{screen_op}}" stroke="{{edge}}" stroke-opacity="{{edge_op}}" stroke-width="1.5"/>
<g font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="{{label}}"><text x="852" y="64">Top</text><text x="796" y="210">Main</text></g>
<rect x="846" y="167" width="280" height="12" rx="6" fill="#E44A4A"/>
<rect x="896" y="158" width="10" height="30" rx="5" fill="#E44A4A"/>
<rect x="1066" y="158" width="10" height="30" rx="5" fill="#E44A4A"/>
<g fill="#E44A4A"><circle cx="900" cy="318" r="3" fill-opacity="0.18"/><circle cx="918" cy="300" r="3" fill-opacity="0.26"/><circle cx="936" cy="282" r="3" fill-opacity="0.34"/><circle cx="954" cy="264" r="3" fill-opacity="0.44"/><circle cx="970" cy="246" r="3" fill-opacity="0.56"/><circle cx="984" cy="228" r="3" fill-opacity="0.7"/></g>
<path transform="translate(992 186) scale(1.45)" d="M0 0 L0 30 L7.5 23 L12.5 34 L17.5 31.8 L12.6 21 L23 21 Z" fill="{{cursor}}" stroke="{{cursor_line}}" stroke-width="1.6" stroke-linejoin="round"/>
</g>
</svg>
