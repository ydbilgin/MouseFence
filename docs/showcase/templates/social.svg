@wrap tagline chars=28 lines=3 line_height=50 top=368
@out docs/media/social-preview.svg
@png docs/media/social-preview.png 1280x640
---
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E141D"/><stop offset="1" stop-color="#1B2432"/></linearGradient>
<radialGradient id="glow" cx="0.76" cy="0.40" r="0.50"><stop offset="0" stop-color="#E44A4A" stop-opacity="0.22"/><stop offset="1" stop-color="#E44A4A" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/><rect width="1280" height="640" fill="url(#glow)"/>
<g font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif">
<text x="96" y="196" font-size="20" font-weight="600" letter-spacing="3.5" fill="#E44A4A" style="text-transform:uppercase">{{kicker}}</text>
<text x="90" y="300" font-size="100" font-weight="700" letter-spacing="-2" fill="#F0F6FC">{{name}}</text>
{{#tagline_lines}}
<text x="96" y="{{y}}" font-size="38" fill="#AEB8C6">{{text}}</text>
{{/tagline_lines}}
<image href="{{icon_data|raw}}" x="96" y="532" width="40" height="40"/>
<text x="150" y="560" font-size="24" fill="#8B949E">{{subtitle}}</text>
<text x="1184" y="560" font-size="24" font-weight="600" fill="#E44A4A" text-anchor="end">github.com/{{repo}}</text>
</g>
<g transform="translate(760 108) scale(1.05)">
<rect x="56" y="0" width="300" height="122" rx="10" fill="#FFFFFF" fill-opacity="0.035" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
<rect x="0" y="146" width="412" height="150" rx="10" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
<g font-family="Segoe UI, Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#7D8896"><text x="72" y="24">Top</text><text x="16" y="170">Main</text></g>
<rect x="66" y="127" width="280" height="12" rx="6" fill="#E44A4A"/>
<rect x="116" y="118" width="10" height="30" rx="5" fill="#E44A4A"/>
<rect x="286" y="118" width="10" height="30" rx="5" fill="#E44A4A"/>
<g fill="#E44A4A"><circle cx="120" cy="278" r="3" fill-opacity="0.18"/><circle cx="138" cy="260" r="3" fill-opacity="0.26"/><circle cx="156" cy="242" r="3" fill-opacity="0.34"/><circle cx="174" cy="224" r="3" fill-opacity="0.44"/><circle cx="190" cy="206" r="3" fill-opacity="0.56"/><circle cx="204" cy="188" r="3" fill-opacity="0.7"/></g>
<path transform="translate(212 146) scale(1.45)" d="M0 0 L0 30 L7.5 23 L12.5 34 L17.5 31.8 L12.6 21 L23 21 Z" fill="#F5F8FC" stroke="#0E141D" stroke-width="1.6" stroke-linejoin="round"/>
</g>
</svg>
