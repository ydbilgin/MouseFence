features_header:
  - Setting
  - What it does
features:
  - name: Crosses freely
    text: The edge behaves like a normal Windows monitor edge.
  - name: Needs a firm push
    text: Slow drift stops at the edge; one quick, deliberate move crosses. The speed is set in Advanced (default 3000 px/s).
  - name: Never crosses
    text: The pointer stays on its side of the edge.
  - name: Keep pointer off
    text: The pointer never enters that screen, and Windows keeps using it as normal.
  - name: Game mode
    text: Holds the pointer on whichever screen it is on, for windowed and borderless games.
  - name: Switches and Pause
    text: Upward passage, side protection and Pause, each with a global shortcut and a tray menu entry.
  - name: Safety escapes
    text: After a layout change MouseFence keeps a way out of every screen, so the pointer is never sealed in.
  - name: Theme and language
    text: Light, Dark or system theme, English and Turkish, settings backup and restore.

