# The three choices for every edge between two screens (glyphs in docs/media/edges/).
edges:
  - name: Crosses freely
    text: A normal Windows monitor edge.
    glyph: docs/media/edges/crosses-freely.svg
  - name: Needs a firm push
    text: Slow drift stops at the edge; one quick, deliberate move crosses.
    glyph: docs/media/edges/needs-a-firm-push.svg
  - name: Never crosses
    text: The pointer stays on its side.
    glyph: docs/media/edges/never-crosses.svg

features:
  - name: Keep pointer off
    text: Mark a screen the pointer must never enter; Windows keeps using it as normal.
  - name: Game mode
    text: Holds the pointer on whichever screen it is on, for windowed and borderless games.
  - name: Quick switches
    text: Upward passage, side protection and Pause, each with a global shortcut and a tray menu entry.
  - name: Crossing speed
    text: Tune how firm a firm push is, in pixels per second (default 3000).
  - name: Safety escapes
    text: After a layout change MouseFence keeps a way out of every screen, so the pointer is never sealed in.
  - name: Small and local
    text: Tray app, no installer, no network code; Light or Dark, English or Turkish, settings backup.

