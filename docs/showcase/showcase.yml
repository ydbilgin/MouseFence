name: MouseFence
repo: ydbilgin/MouseFence
kicker: Fences for multi-monitor Windows
tagline: Keep the mouse pointer on the screen you meant to use.
description: A small Windows tray app that puts gentle fences on the edges between your monitors. It never changes your display layout.
subtitle: Windows 10/11 tray app · .NET 9 · MIT
